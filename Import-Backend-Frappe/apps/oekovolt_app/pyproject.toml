[project]
name = "oekovolt_app"
authors = [
    { name = "ÖKOVOLT", email = "office@oekovolt.at" },
]
description = "Backoffice-Schnittstelle für www.oekovolt.com (Österreich): Referenzprojekte, Formulare, Termine"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe wird von bench bereitgestellt
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
